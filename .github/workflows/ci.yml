name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check every file parses
        run: |
          for file in $(find . -name '*.lua'); do
            luac5.4 -p "$file"
          done

      - name: Run the tests
        run: lua5.4 test/run.lua
